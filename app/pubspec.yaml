name: alo
description: Alô, mensageiro livre com criptografia de ponta a ponta.
publish_to: none
version: 0.3.0+2

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.8 <3.48.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cross_file: 0.3.5+5
  crypto: 3.0.7
  file_picker: 13.1.0
  flutter_contacts: 2.6.0
  flutter_local_notifications: 22.3.2
  flutter_secure_storage: 11.2.0
  flutter_vodozemac: 0.9.0
  http: 1.6.0
  intl: 0.20.3
  just_audio: 0.10.6
  matrix: 14.2.0
  mime: 2.1.0
  path: 1.9.1
  path_provider: 2.1.6
  record: 7.1.2
  share_plus: 13.3.1
  shared_preferences: 2.5.6
  sqflite_common_ffi: 2.4.5
  unifiedpush: 6.2.0
  video_player: 2.11.1

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  unifiedpush_platform_interface: 4.0.0

flutter:
  uses-material-design: true
  generate: true
  # Product flavors in android/app/build.gradle.kts. fdroid (no Google code) is
  # what flutter run, test, drive and build use unless --flavor says otherwise.
  default-flavor: fdroid
  # Inter (text) and JetBrains Mono (recovery key), both SIL OFL 1.1 (licences
  # next to the files). Static weights subset to Latin, built from the
  # variable fonts with fontTools.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-300.ttf
          weight: 300
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
