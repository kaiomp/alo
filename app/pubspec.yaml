name: chama
description: Chama, mensageiro livre com criptografia de ponta a ponta.
publish_to: none
version: 0.2.0+1

environment:
  sdk: ^3.13.7
  flutter: ">=3.47.8 <3.48.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cross_file: 0.3.5+5
  crypto: 3.0.7
  file_picker: 13.1.0
  flutter_secure_storage: 11.2.0
  flutter_vodozemac: 0.9.0
  http: 1.6.0
  intl: 0.20.3
  just_audio: 0.10.6
  matrix: 14.2.0
  mime: 2.1.0
  path: 1.9.1
  path_provider: 2.1.6
  record: 7.1.2
  shared_preferences: 2.5.6
  sqflite_common_ffi: 2.4.5

dev_dependencies:
  flutter_lints: 6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
