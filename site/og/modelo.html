<!doctype html>
<!-- Template for the static share images (public/img/og-*.jpg). How to render: see LEIAME.md.
     Query: ?pagina=inicio|como-funciona|privacidade&formato=largo|quadrado -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Inter; font-weight: 400; src: url(../public/fonts/inter-400.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 600; src: url(../public/fonts/inter-600.woff2) format("woff2"); }
@font-face { font-family: Inter; font-weight: 700; src: url(../public/fonts/inter-700.woff2) format("woff2"); }
:root { --acai: #4A1D6E; --acai-900: #2B0F42; --ipe: #F5B700; --creme: #FFE9A8; --tinta: #1F1724; --tinta-2: #5C5263; }
* { box-sizing: border-box; margin: 0; }
html, body { overflow: hidden; }
body { font-family: Inter, sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
.tela { position: relative; overflow: hidden; width: 1200px; height: 630px; padding: 64px 72px; display: flex; flex-direction: column; }
.quadrado { width: 600px; height: 600px; padding: 48px; }
.claro { color: var(--tinta); background: radial-gradient(60% 70% at 0% 0%, rgb(245 183 0 / .35), transparent 70%), radial-gradient(60% 60% at 100% 100%, rgb(74 29 110 / .14), transparent 70%), linear-gradient(#FFF6DA, #FBF6EE); }
.escuro { color: #fff; background: radial-gradient(90% 100% at 90% 0%, #7B3AAD, #4A1D6E 70%); }
svg.marca { overflow: visible; }
svg.marca path { fill: none; stroke: currentColor; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
.claro .marca { color: var(--acai); } .escuro .marca { color: var(--ipe); }
.topo { display: flex; align-items: center; gap: 14px; font-weight: 700; font-size: 40px; letter-spacing: -.03em; }
.topo svg { width: 52px; height: 52px; }
.claro .topo { color: var(--acai); }
h1 { font-weight: 700; letter-spacing: -.04em; line-height: 1.02; }
.claro h1 { color: var(--acai); }
.sub { margin-top: 22px; font-size: 30px; line-height: 1.3; }
.claro .sub { color: var(--tinta-2); } .escuro .sub { color: var(--creme); }
.grifo { background: linear-gradient(transparent 66%, var(--ipe) 66%, var(--ipe) 92%, transparent 92%); }
.escuro .destaque { color: var(--ipe); }
.pilula { margin-top: auto; align-self: flex-start; padding: 14px 28px; border-radius: 999px; font-weight: 700; font-size: 27px; }
.claro .pilula { background: var(--acai); color: #fff; } .escuro .pilula { background: var(--ipe); color: var(--acai-900); }
.texto { position: relative; z-index: 2; width: 600px; display: flex; flex-direction: column; flex: 1; }
.quadrado .texto { width: auto; }
.fone { position: absolute; width: 250px; padding: 7px; border-radius: 34px; background: #17111C; box-shadow: 0 30px 60px -20px rgb(43 15 66 / .55), 0 0 0 1px rgb(0 0 0 / .4); }
.fone img { display: block; width: 100%; border-radius: 27px; }
.cartao { position: absolute; right: 64px; top: 168px; width: 480px; padding: 34px 36px; border-radius: 30px; background: #fff; box-shadow: 0 24px 60px -24px rgb(43 15 66 / .35); display: grid; gap: 24px; }
.cartao div { display: flex; align-items: center; gap: 18px; font-size: 25px; font-weight: 600; color: var(--tinta); }
.cartao svg { width: 40px; height: 40px; flex: none; }
.quadrado .cartao { position: static; width: auto; margin-top: 30px; padding: 26px 28px; gap: 16px; box-shadow: 0 16px 40px -20px rgb(43 15 66 / .35); }
.chips { position: absolute; right: 64px; top: 120px; width: 470px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: flex-end; }
.chips span { padding: 14px 24px; border-radius: 999px; background: rgb(255 255 255 / .1); box-shadow: inset 0 0 0 2px rgb(255 233 168 / .35); color: #fff; font-size: 26px; font-weight: 600; }
.chips span.on { background: var(--ipe); color: var(--acai-900); box-shadow: none; }
.chips span.on::before { content: "✓ "; }
.quadrado .chips { position: static; width: auto; justify-content: flex-start; margin-top: 34px; gap: 10px; }
.quadrado .chips span { padding: 10px 18px; font-size: 20px; }
.quadrado .cartao div { font-size: 22px; } .quadrado .cartao svg { width: 32px; height: 32px; }
</style>
</head>
<body>
<script>
const LOGO = '<svg class="marca" viewBox="10 10 80 80" aria-hidden="true"><path d="M22 86L30 68C14 56 13 38 24 29Q37 13 50 28Q63 13 76 29C87 38 86 57 72 66Q52 77 30 68"/></svg>';
const TOPO = `<div class="topo">${LOGO}<span>Alô</span></div>`;
const fone = (img, css) => `<figure class="fone" style="${css}"><img src="../public/img/${img}.webp"></figure>`;
const CHECK = '<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="20" fill="#4A1D6E"/><path d="m12 20.5 5.5 5.5L28.5 14" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const LISTA = `<div class="cartao"><div>${CHECK}Sem cookies de rastreamento</div><div>${CHECK}Seu IP não é gravado</div><div>${CHECK}Apague quando quiser</div></div>`;

const CHIPS = `<div class="chips"><span class="on">Desenvolvimento</span><span class="on">Design</span><span>Comunicação</span><span>Jurídico</span><span class="on">Políticas públicas</span><span>Testar o app</span><span>Outro</span></div>`;

const q = new URLSearchParams(location.search);
const pagina = q.get('pagina') || 'inicio';
const quadrado = q.get('formato') === 'quadrado';

const largo = {
  inicio: ['claro', `
    <div class="texto">
      <svg class="marca" viewBox="10 10 80 80" style="width:84px;height:84px">${LOGO.match(/<path[^>]*\/>/)[0]}</svg>
      <h1 style="font-size:156px;letter-spacing:-.055em;margin-top:6px">Alô</h1>
      <p class="sub" style="font-size:42px;font-weight:600;color:#1F1724;letter-spacing:-.02em;margin-top:8px">Livre, aberto, <span class="grifo">sem dono</span>.</p>
      <p class="sub" style="margin-top:10px">Feito no Brasil, para o Brasil.</p>
      <span class="pilula">usealo.app</span>
    </div>
    ${fone('hero-momento', 'right:270px;top:84px;transform:rotate(-6deg)')}
    ${fone('hero-conversa', 'right:44px;top:132px;transform:rotate(5deg)')}`],
  'como-funciona': ['escuro', `
    <div class="texto">
      ${TOPO}
      <h1 style="font-size:78px;margin-top:64px">Seis partes,<br><span class="destaque">um cuidado só.</span></h1>
      <p class="sub" style="width:520px">Conversas, Momentos, Rede, Voz, Bem-estar e Modo simples.</p>
      <span class="pilula">usealo.app</span>
    </div>
    ${fone('rede', 'right:330px;top:150px;transform:rotate(-7deg);width:230px')}
    ${fone('voz', 'right:40px;top:150px;transform:rotate(7deg);width:230px')}
    ${fone('momentos', 'right:176px;top:96px;width:240px;z-index:1')}`],
  privacidade: ['claro', `
    <div class="texto">
      ${TOPO}
      <h1 style="font-size:66px;margin-top:72px">Seus dados,<br>em poucas linhas.</h1>
      <p class="sub" style="width:520px">O que guardamos, para quê, e como pedir para apagar.</p>
      <span class="pilula">usealo.app</span>
    </div>
    ${LISTA}`],
  ajudar: ['escuro', `
    <div class="texto">
      ${TOPO}
      <h1 style="font-size:74px;margin-top:56px">Quero ajudar a construir o <span class="destaque">Alô</span>.</h1>
      <p class="sub" style="width:540px">Devs, designers e gente que acredita nisso.</p>
      <span class="pilula">usealo.app/ajudar</span>
    </div>
    ${CHIPS}`],
};

const quad = {
  inicio: ['claro', `
    <div class="texto" style="align-items:center;text-align:center;justify-content:center">
      <svg class="marca" viewBox="10 10 80 80" style="width:110px;height:110px">${LOGO.match(/<path[^>]*\/>/)[0]}</svg>
      <h1 style="font-size:150px;letter-spacing:-.055em;margin-top:8px">Alô</h1>
      <p class="sub" style="font-size:36px;font-weight:600;color:#1F1724;letter-spacing:-.02em;margin-top:6px">Livre, aberto, <span class="grifo">sem dono</span>.</p>
      <p class="sub" style="font-size:26px;margin-top:10px">Feito no Brasil, para o Brasil.</p>
    </div>`],
  'como-funciona': ['escuro', `
    <div class="texto">
      ${TOPO}
      <h1 style="font-size:64px;margin-top:40px">Seis partes,<br><span class="destaque">um cuidado só.</span></h1>
    </div>
    ${fone('rede', 'left:48px;top:330px;transform:rotate(-6deg);width:220px')}
    ${fone('momentos', 'right:48px;top:350px;transform:rotate(6deg);width:220px')}`],
  privacidade: ['claro', `
    <div class="texto">
      ${TOPO}
      <h1 style="font-size:60px;margin-top:40px">Seus dados,<br>em poucas linhas.</h1>
      ${LISTA}
    </div>`],
  ajudar: ['escuro', `
    <div class="texto">
      ${TOPO}
      <h1 style="font-size:56px;margin-top:40px">Quero ajudar a construir o <span class="destaque">Alô</span>.</h1>
      ${CHIPS}
      <span class="pilula">usealo.app/ajudar</span>
    </div>`],
};

const [tema, html] = (quadrado ? quad : largo)[pagina];
document.body.innerHTML = `<main class="tela ${tema}${quadrado ? ' quadrado' : ''}">${html}</main>`;
</script>
</body>
</html>
