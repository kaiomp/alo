name: chama
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: synapse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: synapse
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U synapse"], interval: 3s, retries: 20 }

  redis:
    image: redis:7-alpine
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 3s, retries: 20 }

  synapse:
    image: ghcr.io/element-hq/synapse:v1.163.2
    entrypoint: ["python", "-m", "synapse.app.homeserver", "--config-path", "/data/homeserver.yaml"]
    volumes: ["./data/synapse:/data", "./data/media:/media"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck: { test: ["CMD", "curl", "-fs", "http://localhost:8008/health"], interval: 5s, retries: 30 }

  sync1:
    image: ghcr.io/element-hq/synapse:v1.163.2
    entrypoint: ["python", "-m", "synapse.app.generic_worker", "--config-path", "/data/homeserver.yaml", "--config-path", "/data/workers/sync1.yaml"]
    volumes: ["./data/synapse:/data"]
    depends_on: { synapse: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "curl", "-fs", "http://localhost:8083/health"], interval: 5s, retries: 30 }

  media1:
    image: ghcr.io/element-hq/synapse:v1.163.2
    entrypoint: ["python", "-m", "synapse.app.generic_worker", "--config-path", "/data/homeserver.yaml", "--config-path", "/data/workers/media1.yaml"]
    volumes: ["./data/synapse:/data", "./data/media:/media"]
    depends_on: { synapse: { condition: service_healthy } }
    healthcheck: { test: ["CMD", "curl", "-fs", "http://localhost:8085/health"], interval: 5s, retries: 30 }

  # No published port: chama-id trusts X-Forwarded-For, so only Caddy may reach it.
  chama-id:
    build: { context: .., dockerfile: services/chama-id/Dockerfile }
    environment:
      JWT_SECRET: ${JWT_SECRET}
      OTP_PEPPER: ${OTP_PEPPER}
      SERVER_NAME: ${SERVER_NAME}
      PUBLIC_BASEURL: ${PUBLIC_BASEURL}
      CHAMA_DEV: "1"
      DB_PATH: /data/chama-id.sqlite
      SYNAPSE_INTERNAL_URL: http://synapse:8008
      REGISTRATION_SHARED_SECRET: ${REGISTRATION_SHARED_SECRET}
    volumes: ["./data/chama-id:/data"]
    depends_on: { synapse: { condition: service_healthy } }

  caddy:
    image: caddy:2-alpine
    ports: ["8080:8080"]
    volumes: ["./caddy/Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on:
      synapse: { condition: service_healthy }
      sync1: { condition: service_healthy }
      media1: { condition: service_healthy }
      chama-id: { condition: service_healthy }

volumes:
  pgdata:
